spring.application.name=GatewayT-service
# Server port
server.port=8082

spring.application.name=gateway-service

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lowerCaseServiceId=true

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[1].id=plan-service
spring.cloud.gateway.routes[1].uri=lb://plan-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/plans/**

spring.cloud.gateway.routes[2].id=usage-service
spring.cloud.gateway.routes[2].uri=lb://usage-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/usage-logs/**

spring.cloud.gateway.routes[3].id=billing-service
spring.cloud.gateway.routes[3].uri=lb://billing-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/billing/**

spring.cloud.gateway.routes[4].id=auth-service
spring.cloud.gateway.routes[4].uri=lb://auth-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=*

